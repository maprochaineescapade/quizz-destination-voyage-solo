            const [currentStep, setCurrentStep] = useState(0); // 0: intro, 1-5: questions, 6: résultats
            const [answers, setAnswers] = useState({});

            const handleSelectOption = (questionId, value) => {
                setAnswers(prev => ({ ...prev, [questionId]: value }));
            };

            const handleNext = () => {
                setCurrentStep(prev => prev + 1);
            };

            const handlePrev = () => {
                if (currentStep > 0) {
                    setCurrentStep(prev => prev - 1);
                }
            };

            // Calcul des 5 destinations les plus pertinentes
            const calculateTopDestinations = () => {
                const userGeo = answers.geo || "both";
                const userEnv = answers.env || "mix";
                const userDuration = answers.duration || "medium";
                const userTransport = answers.transport || "all";
                const userBudget = answers.budget || "medium";

                const scored = DESTINATIONS_DB.map(dest => {
                    let points = 0;

                    if (userGeo === "both" || dest.geo === userGeo) points += 30; else points += 10;
                    if (userEnv === "mix" || dest.env.includes(userEnv) || dest.env.includes("mix")) points += 25; else points += 10;
                    if (userTransport === "all" || dest.transport.includes(userTransport)) points += 15; else points += 5;
                    if (dest.duration.includes(userDuration)) points += 15; else points += 5;
                    if (dest.budget.includes(userBudget)) points += 15; else points += 5;

                    return { ...dest, scorePercent: points };
                });

                scored.sort((a, b) => b.scorePercent - a.scorePercent);
                return scored.slice(0, 5);
            };

            const isQuizFinished = currentStep > QUESTIONS.length;
            const top5 = isQuizFinished ? calculateTopDestinations() : [];

            return (

                                    <circle cx="35" cy="40" r="5" fill="#ffffff"/>
                                    <circle cx="65" cy="40" r="5" fill="#ffffff"/>

                                </h1>

                                </p>
                            </div>

                            </h2>
                            <p className="text-gray-600 mb-8 leading-relaxed text-base sm:text-lg">
                                Réponds à ces 5 petites questions simples. On fait le point ensemble sur tes envies pour te révéler 5 destinations au top, ultra adaptées pour t'élancer en toute sérénité.
                            </p>

                                onClick={() => setCurrentStep(1)}
                                className="w-full sm:w-auto px-10 py-4 rounded-2xl font-bold text-lg btn-brand shadow-lg"
                            >
                                C'est parti ! <i className="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    )}

                    {/* Étapes 1 à 5 : QUESTIONS */}
                    {currentStep > 0 && currentStep <= QUESTIONS.length && (

                                    </span>

                                </div>

                                        <div

                                        </div>
                                    );
                                })}
                            </div>

                            {/* Boutons de navigation */}
                            <div className="flex justify-between items-center pt-4 border-t border-gray-100">
                                <button
                                    onClick={handlePrev}
                                    className="px-6 py-2.5 rounded-xl text-gray-600 font-semibold hover:bg-gray-100 transition"
                                >
                                    <i className="fa-solid fa-arrow-left mr-2"></i> Retour
                                </button>
                                
                                <button
                                    onClick={handleNext}
                                    disabled={!answers[QUESTIONS[currentStep - 1].id]}
                                    className={`px-8 py-3 rounded-xl font-bold transition flex items-center gap-2 ${answers[QUESTIONS[currentStep - 1].id] ? 'btn-brand' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                                >
                                    {currentStep === QUESTIONS.length ? 'Découvrir mes destinations' : 'Suivant'} <i className="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>

                        </div>
                    )}

                    {/* Étape 6 : RÉSULTATS */}
                    {isQuizFinished && (
                        <div className="p-6 sm:p-10">
                            <div className="text-center max-w-2xl mx-auto mb-10">
                                <h2 className="text-3xl sm:text-4xl font-londrina text-brand-primary tracking-wide mb-2">
                                    Tes 5 destinations coups de cœur !
                                </h2>
                                <p className="text-gray-600">
                                    Voici les pépites qui correspondent le mieux à ton profil pour un premier départ en toute sérénité :
                                </p>
                            </div>

                            {/* Liste des 5 destinations */}
                            <div className="space-y-6 mb-10">
                                {top5.map((dest, index) => (
                                    <div 
                                        key={dest.id}
                                        className="border-2 border-brand-light bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-md transition flex flex-col md:flex-row"
                                    >
                                        {/* Photo */}
                                        <div className="md:w-1/3 relative h-48 md:h-auto min-h-[200px]">
                                            <img 
                                                src={dest.image} 
                                                alt={dest.name} 
                                                className="w-full h-full object-cover"
                                            />
                                            <div className="absolute top-3 left-3 bg-brand-primary text-white text-xs font-bold px-3 py-1 rounded-full shadow">
                                                Coup de cœur #{index + 1}
                                            </div>
                                        </div>

                                        {/* Description */}
                                        <div className="p-6 md:w-2/3 flex flex-col justify-between">
                                            <div>
                                                <div className="flex items-center justify-between mb-2">
                                                    <span className="text-xs font-bold uppercase tracking-wider text-brand-primary">
                                                        {dest.flag} {dest.region}
                                                    </span>
                                                </div>

                                                <h3 className="text-2xl font-bold text-gray-900 mb-2">
                                                    {dest.name}
                                                </h3>

                                                <p className="text-gray-600 text-sm mb-4 leading-relaxed">
                                                    {dest.description}
                                                </p>

                                                {/* Point d'intérêt solo */}
                                                <div className="bg-blue-50/70 rounded-xl p-3 mb-4 border border-blue-100">
                                                    <h4 className="text-xs font-bold text-brand-primary uppercase tracking-wider mb-1">
                                                        Pourquoi c'est top pour voyager solo :
                                                    </h4>
                                                    <p className="text-xs text-gray-700">
                                                        {dest.whySolo}
                                                    </p>
                                                </div>

                                                {/* Activités */}
                                                <div>
                                                    <h4 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">
                                                        Ce que tu vas adorer faire :
                                                    </h4>
                                                    <div className="flex flex-wrap gap-2">
                                                        {dest.activities.map((act, aIdx) => (
                                                            <span key={aIdx} className="bg-gray-100 text-gray-700 text-xs px-3 py-1 rounded-lg">
                                                                <i className="fa-solid fa-check text-brand-primary mr-1"></i> {act}
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Recommencer */}
                            <div className="text-center pt-6 border-t border-gray-100">
                                <button
                                    onClick={() => {
                                        setAnswers({});
                                        setCurrentStep(0);
                                    }}
                                    className="px-8 py-3 rounded-2xl font-bold text-brand-primary border-2 border-brand-primary hover:bg-brand-light transition"
                                >
                                    <i className="fa-solid fa-rotate-right mr-2"></i> Refaire le test
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Signature et Copyright du programme */}
                    <footer className="text-center py-4 bg-gray-50 border-t border-gray-100 text-xs text-gray-500 font-bold tracking-wider uppercase font-londrina">
                        SOLO & SEREINE - TOUS DROITS RESERVES
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
