                budget: ['high'],

                type: ['nature'],
                image: 'https://images.unsplash.com/photo-1518259102261-b40117eabbc9?auto=format&fit=crop&w=800&q=80'
            },
            {
                id: 'new-york',
                name: 'New York',
                region: 'États-Unis',
                country: 'États-Unis',
                zone: 'world',
                tagline: 'Énergie mythique, musées & gratte-ciels',
                desc: 'La ville qui ne dort jamais et où l'on ne s'ennuie jamais.',
                whySolo: 'On se sent portée par l'énergie constante de la ville.',
                activities: ['Balade guidée dans Central Park', 'Traversée du pont de Brooklyn', 'Coucher de soleil depuis le Top of the Rock'],
                budget: ['medium', 'high'],
                transport: ['plane'],
                duration: ['medium', 'long'],
                type: ['ville'],

        ];

        // QUESTIONS DU QUIZZ
        const QUESTIONS = [
            {
                id: 'zone',
                title: 'Où aimerais-tu vous envoler pour cette aventure ?',
                subtitle: 'Sélectionne la zone géographique qui t'attire',
                options: [
                    { value: 'france', label: 'En France', desc: 'Ressourcement garanti sans quitter l'hexagone' },
                    { value: 'europe', label: 'En Europe & Proche Étranger', desc: 'Dépaysement assuré à quelques heures de trajet' },
                    { value: 'world', label: 'Grand Large / International', desc: 'Le grand saut vers des horizons plus lointains' },
                    { value: 'any', label: 'Peu importe, je suis curieuse !', desc: 'Laisse l'algorithme me surprendre' }
                ]
            },
            {
                id: 'duration',
                title: 'Combien de temps peux-tu accorder à ce séjour ?',
                subtitle: 'Choisis la durée idéale de ton escapade',
                options: [
                    { value: 'short', label: 'Un week-end prolongé (2 à 4 jours)', desc: 'Parfait pour faire une pause sans trop s'éloigner' },
                    { value: 'medium', label: 'Une belle semaine (5 à 9 jours)', desc: 'Le bon équilibre pour explorer sans se presser' },
                    { value: 'long', label: 'Deux semaines ou plus', desc: 'L'immersion totale pour déconnecter' }
                ]
            },
            {
                id: 'transport',
                title: 'Quel mode de transport préfères-tu utiliser ?',
                subtitle: 'Ta façon privilégiée de voyager',
                options: [
                    { value: 'train', label: 'Le Train', desc: 'Écologique, confortable et central' },
                    { value: 'plane', label: 'L'Avion', desc: 'Idéal pour aller plus loin ou gagner du temps' },
                    { value: 'car', label: 'La Voiture', desc: 'Liberté totale sur la route' }
                ]
            },
            {
                id: 'type',
                title: 'Quel cadre te ressource le plus ?',
                subtitle: 'L'ambiance dont tu as besoin en ce moment',
                options: [
                    { value: 'ville', label: 'Culture & Villes de charme', desc: 'Musées, flânerie et terrasses' },
                    { value: 'mer', label: 'Mer & Côtes maritimes', desc: 'Air iodé, plages et son des vagues' },
                    { value: 'nature', label: 'Grands Espaces & Nature', desc: 'Randonnée, verdure et grand air' },
                    { value: 'lac', label: 'Lacs & Montagnes', desc: 'Sérénité au bord de l'eau ou sommets' },
                    { value: 'campagne', label: 'Campagne & Villages', desc: 'Douceur de vivre et authenticité' }
                ]
            },
            {
                id: 'budget',
                title: 'Quel est ton budget approximatif pour ce voyage ?',
                subtitle: 'Hors dépenses exceptionnelles',
                options: [
                    { value: 'low', label: 'Budget Doux', desc: 'Solutions économiques et astucieuses' },
                    { value: 'medium', label: 'Budget Modéré', desc: 'Le juste milieu entre confort et se faire plaisir' },
                    { value: 'high', label: 'Budget Confort / Sans compter', desc: 'Expérience haut de gamme et sérénité totale' }
                ]
            }
        ];

        // APPLICATION PRINCIPALE
        function App() {
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [answers, setAnswers] = useState({});
            const [results, setResults] = useState(null);

            const handleSelectOption = (value) => {
                const currentQuestionId = QUESTIONS[currentQuestion].id;
                const updatedAnswers = { ...answers, [currentQuestionId]: value };
                setAnswers(updatedAnswers);

                if (currentQuestion < QUESTIONS.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                } else {
                    calculateResults(updatedAnswers);
                }
            };

            const calculateResults = (finalAnswers) => {
                // FILTRAGE STRICT DE ZONE
                let pool = [...DESTINATIONS];
                if (finalAnswers.zone && finalAnswers.zone !== 'any') {
                    pool = pool.filter(d => d.zone === finalAnswers.zone);
                }

                // CALCUL DES SCORES DE COMPATIBILITÉ
                const scoredPool = pool.map(dest => {
                    let score = 0;

                    // Durée (30 pts)
                    if (dest.duration.includes(finalAnswers.duration)) score += 30;

                    // Transport (25 pts)
                    if (dest.transport.includes(finalAnswers.transport)) score += 25;

                    // Type/Ambiance (25 pts)
                    if (dest.type.includes(finalAnswers.type) || dest.type.includes('mix')) score += 25;

                    // Budget avec règle ascendante (20 pts)
                    if (finalAnswers.budget === 'high') {
                        // Un budget élevé est compatible avec TOUS les budgets (low, medium, high)
                        score += 20;
                    } else if (finalAnswers.budget === 'medium') {
                        // Un budget medium match avec medium et low
                        if (dest.budget.includes('medium') || dest.budget.includes('low')) score += 20;
                    } else {
                        // Budget low match avec low
                        if (dest.budget.includes('low')) score += 20;
                    }

                    return { ...dest, score };
                });

                // Tri par score décroissant
                scoredPool.sort((a, b) => b.score - a.score);

                // Application de la règle d'unicité par pays (max 1 destination par pays dans le Top 5)
                const top5 = [];
                const usedCountries = new Set();

                for (const dest of scoredPool) {
                    if (!usedCountries.has(dest.country)) {
                        top5.push(dest);
                        usedCountries.add(dest.country);
                    }
                    if (top5.length === 5) break;
                }

                setResults(top5);
            };

            const resetQuiz = () => {
                setCurrentQuestion(0);
                setAnswers({});
                setResults(null);
            };

            return (
                <div className="min-h-screen flex flex-col justify-between">
                    {/* Header avec Logo */}
                    <header className="bg-brand-blue text-white py-4 px-6 shadow-md">
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                {/* SVG Logo Smiley Blanc */}
                                <svg className="w-9 h-9 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                    <circle cx="12" cy="12" r="10" />
                                    <path d="M8 14s1.5 2 4 2 4-2 4-2" />
                                    <line x1="9" y1="9" x2="9.01" y2="9" strokeWidth="3" />
                                    <line x1="15" y1="9" x2="15.01" y2="9" strokeWidth="3" />
                                </svg>
                                <div>
                                    <h1 className="font-extrabold text-xl tracking-tight leading-none">SOLO & SEREINE</h1>
                                    <p className="text-xs text-brand-light font-medium mt-0.5">Guide de voyage solo au féminin</p>
                                </div>
                            </div>
                            {results && (
                                <button onClick={resetQuiz} className="text-xs bg-white/20 hover:bg-white/30 text-white font-semibold py-1.5 px-3 rounded-full transition">
                                    Recommencer
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Contenu principal */}
                    <main className="max-w-3xl mx-auto px-4 py-8 flex-grow w-full">
                        {!results ? (
                            <div>
                                {/* Barre de progression */}
                                <div className="mb-8">
                                    <div className="flex justify-between text-xs text-slate-500 font-semibold mb-2">
                                        <span>Question {currentQuestion + 1} sur {QUESTIONS.length}</span>
                                        <span>{Math.round(((currentQuestion + 1) / QUESTIONS.length) * 100)}%</span>
                                    </div>
                                    <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                                        <div 
                                            className="bg-brand-blue h-full transition-all duration-300 ease-out" 
                                            style={{ width: `${((currentQuestion + 1) / QUESTIONS.length) * 100}%` }}
                                        ></div>
                                    </div>
                                </div>

                                {/* Question en cours */}
                                <div className="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-slate-100">
                                    <h2 className="text-2xl font-bold text-slate-800 mb-2">
                                        {QUESTIONS[currentQuestion].title}
                                    </h2>
                                    <p className="text-slate-500 text-sm mb-6">
                                        {QUESTIONS[currentQuestion].subtitle}
                                    </p>

                                    <div className="space-y-3">
                                        {QUESTIONS[currentQuestion].options.map((opt) => (
                                            <button
                                                key={opt.value}
                                                onClick={() => handleSelectOption(opt.value)}
                                                className="w-full text-left p-4 rounded-xl border border-slate-200 hover:border-brand-blue hover:bg-brand-light/20 transition duration-150 group flex flex-col justify-center"
                                            >
                                                <span className="font-semibold text-slate-800 group-hover:text-brand-blue text-base">
                                                    {opt.label}
                                                </span>
                                                <span className="text-xs text-slate-500 mt-1">
                                                    {opt.desc}
                                                </span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* Résultats */
                            <div>
                                <div className="text-center mb-8">
                                    <h2 className="text-3xl font-extrabold text-slate-800 mb-2">
                                        Tes 5 destinations coups de cœur ! 🎉
                                    </h2>
                                    <p className="text-slate-600 text-sm max-w-lg mx-auto">
                                        Sur la base de tes réponses, voici les destinations les plus sûres, inspirantes et adaptées pour ton aventure solo.
                                    </p>
                                </div>

                                <div className="space-y-6">
                                    {results.map((item, idx) => (
                                        <div key={item.id} className="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-100 flex flex-col md:flex-row">
                                            {/* Visuel */}
                                            <div className="md:w-2/5 relative min-h-[200px] bg-slate-100">
                                                <img 
                                                    src={item.image} 
                                                    alt={item.name} 
                                                    className="w-full h-full object-cover absolute inset-0"
                                                    onError={(e) => {
                                                        e.target.onerror = null; 
                                                        e.target.src='https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=800&q=80'
                                                    }}
                                                />
                                                <div className="absolute top-3 left-3 bg-brand-blue text-white text-xs font-bold px-3 py-1 rounded-full shadow">
                                                    Coup de cœur #{idx + 1}
                                                </div>
                                            </div>

                                            {/* Détails */}
                                            <div className="p-6 md:w-3/5 flex flex-col justify-between">
                                                <div>
                                                    <div className="text-xs font-bold uppercase tracking-wider text-brand-blue mb-1">
                                                        {item.country}
                                                    </div>
                                                    <h3 className="text-xl font-bold text-slate-800 mb-2">
                                                        {item.name}
                                                    </h3>
                                                    <p className="text-slate-600 text-xs mb-4">
                                                        {item.desc}
                                                    </p>

                                                    <div className="bg-brand-light/30 p-3 rounded-lg border border-brand-light/50 mb-4">
                                                        <h4 className="text-xs font-bold text-brand-blue uppercase mb-1">
                                                            Pourquoi c'est top pour voyager solo :
                                                        </h4>
                                                        <p className="text-xs text-slate-700">
                                                            {item.whySolo}
                                                        </p>
                                                    </div>

                                                    <div>
                                                        <h4 className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
                                                            Ce que tu vas adorer faire :
                                                        </h4>
                                                        <ul className="space-y-1.5">
                                                            {item.activities.map((act, i) => (
                                                                <li key={i} className="text-xs text-slate-700 flex items-center">
                                                                    <svg className="w-3.5 h-3.5 text-emerald-500 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path>
                                                                    </svg>
                                                                    {act}
                                                                </li>
                                                            ))}
                                                        </ul>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="mt-8 text-center">
                                    <button onClick={resetQuiz} className="bg-brand-blue hover:bg-blue-800 text-white font-bold py-3 px-8 rounded-full shadow-md transition">
                                        Refaire le questionnaire
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer Copyright */}
                    <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
                        <p>© SOLO & SEREINE — Tous droits réservés. Conçu avec soin pour les voyaguses en solo.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
